# ==============================================================================
# LedgerGuard Institutional Treasury Terminal - Render Production Blueprint
# Category: Best Use of Render ($1,000) & Grand Prize ($12,000)
# ==============================================================================
services:
  - type: web
    name: ledgerguard-terminal
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/security/verify-all
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: OPENAI_API_KEY
        sync: false
      - key: MFA_ENFORCEMENT_ENABLED
        value: "true"

databases:
  - name: ledgerguard-postgres
    plan: starter
    databaseName: ledgerguard_prod
    user: ledgerguard_admin
    region: oregon
